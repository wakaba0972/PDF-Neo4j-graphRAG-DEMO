name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'data/**'
      - 'start.sh'
      - 'requirements-dev.txt'
      - '.env.example'
      - '.gitignore'

  # 手動觸發 workflow 執行編譯
  workflow_dispatch:
    inputs:
      custom_tag:
        description: '自訂映像檔標籤（選填，例如：v1.0.0 或 test；留空則使用預設標籤）'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 取得程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Buildx 快取環境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登入 GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 解析與產出 Image 標籤 (Tags) 與標記 (Labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # push 到 main 時產生 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # 產生短 commit hash 標籤 (如 sha-a1b2c3d)
            type=sha,format=short,prefix=sha-
            # 若手動執行且有填寫 custom_tag 時產出該標籤
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      # 5. 編譯並推送到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
