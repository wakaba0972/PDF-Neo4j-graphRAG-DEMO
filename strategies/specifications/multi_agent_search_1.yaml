id: multi_agent_search_1
name: Multi-Agent Search 1
order: 60
implementation:
  file: multi_agent_search_1/strategy.py
  class: MultiAgentSearch1Strategy
parameters:
  candidate_top_k:
    type: integer
    minimum: 1
    maximum: 50
    minimum_is_top_k: true
    visible: false
  seed_top_k:
    type: integer
    label: 每份文件的向量起始證據數
    default: 6
    minimum: 1
    maximum: 20
    control: slider
  max_tool_calls:
    type: integer
    label: 每個文件 Agent 的工具呼叫上限
    default: 6
    minimum: 1
    maximum: 20
    control: slider
  result_limit:
    type: integer
    label: 每次工具最多回傳證據數
    default: 8
    minimum: 1
    maximum: 20
    control: slider
  max_runtime_seconds:
    type: number
    label: 每個文件 Agent 搜尋時間上限（秒）
    default: 30.0
    minimum: 5
    maximum: 120
    control: slider
  effective_search_ratio:
    type: integer
    label: 起始有效搜尋比例
    default: 3
    minimum: 1
    maximum: 10
    control: slider
  max_parallel_agents:
    type: integer
    label: 最大並行文件 Agent 數
    default: 4
    minimum: 1
    maximum: 16
    control: slider
