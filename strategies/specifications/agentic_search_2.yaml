id: agentic_search_2
name: Agentic Search 2
order: 40
implementation:
  file: agentic_search_2/strategy.py
  class: AgenticSearch2RetrievalStrategy
parameters:
  candidate_top_k:
    type: integer
    minimum: 1
    maximum: 50
    minimum_is_top_k: true
    visible: false
  seed_top_k:
    type: integer
    label: 向量起始證據數
    default: 4
    minimum: 1
    maximum: 20
    control: slider
  max_rounds:
    type: integer
    label: LLM 搜尋輪數上限
    default: 3
    minimum: 1
    maximum: 6
    control: slider
  result_limit:
    type: integer
    label: 每輪 Cypher 結果上限
    default: 8
    minimum: 1
    maximum: 30
    control: slider
  max_runtime_seconds:
    type: number
    label: 搜尋總時間上限（秒）
    default: 45.0
    minimum: 5
    maximum: 120
    control: slider
  effective_search_ratio:
    type: integer
    label: 起始有效搜尋比例
    default: 3
    minimum: 1
    maximum: 10
    control: slider
